<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/klvr-logo.png" type="image/png">
  <title>Klvr Charger Pro</title>
  <style>
    :root {
      --bg: #050505;
      --fg: #f2f2f2;
      --muted: #7a7a7a;
      --well: #121212;
      --well-border: #2a2a2a;
      --cell: #2c2c2c;
      --control: #3b82f6;
      --glass-w: 480px;
      --glass-h: 128px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: "SF Pro Text", "SF Pro Display", ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 56px 24px; min-height: 100vh;
    }
    .charger {
      display: flex; flex-direction: column; gap: 36px;
      width: min(960px, 100%);
    }
    .face {
      display: flex; align-items: center; gap: 24px;
      justify-content: center;
    }
    .glass-wrap {
      width: var(--glass-w); height: var(--glass-h);
      background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 3px;
      overflow: hidden; image-rendering: pixelated;
      position: relative; box-shadow: inset 0 0 0 1px #111;
    }
    .glass-wrap img, .glass-wrap canvas {
      width: 100%; height: 100%; display: block;
    }
    .knob {
      width: 64px; height: 64px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3a3a3a, #141414 72%);
      border: 2px solid #4a4a4a; cursor: grab; position: relative;
      touch-action: none; flex-shrink: 0;
      transition: border-color 160ms ease;
    }
    .knob::after {
      content: ""; position: absolute; left: 50%; top: 10px;
      width: 3px; height: 16px; margin-left: -1.5px;
      background: #e8e8e8; border-radius: 1px;
      transform-origin: 50% 22px;
    }
    .knob.turning { cursor: grabbing; border-color: #888; }
    .rack { display: flex; flex-direction: column; gap: 18px; }
    .row { display: flex; gap: 28px; justify-content: center; }
    .half {
      display: grid; grid-template-columns: repeat(12, 30px); gap: 7px;
    }
    .well {
      width: 30px; height: 52px; border-radius: 5px;
      background: var(--well); border: 1px solid var(--well-border);
      cursor: pointer; position: relative;
      transition: transform 160ms ease, border-color 160ms ease;
    }
    .well:hover { border-color: #555; }
    .well:active { transform: scale(0.96); }
    .well.pending {
      border-color: var(--control);
      box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.45);
    }
    .well .cell {
      position: absolute; left: 5px; right: 5px; top: 7px; bottom: 10px;
      border-radius: 3px; background: var(--cell);
      border: 1px solid #3a3a3a;
    }
    .well .cell.aaa { transform: scale(0.78); transform-origin: center bottom; }
    .well .fill {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: #3a3a3a; border-radius: 0 0 2px 2px;
      transition: height 200ms ease;
    }
    .well .light {
      position: absolute; left: 50%; bottom: 3px; width: 10px; height: 3px;
      margin-left: -5px; border-radius: 1px; background: transparent;
      transition: background 80ms linear;
    }
    .type-pop {
      position: fixed; z-index: 20; display: none;
      background: #141414; border: 1px solid #333; border-radius: 10px;
      padding: 6px; gap: 4px; box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }
    .type-pop.open { display: inline-flex; }
    .type-pop button {
      background: transparent; color: var(--fg); border: 0;
      padding: 10px 18px; font: inherit; cursor: pointer; border-radius: 7px;
    }
    .type-pop button:hover { background: #222; }
    .status {
      text-align: center; color: var(--muted); font-size: 12px; min-height: 1.2em;
    }
    .engineer {
      margin-top: 4px; border-top: 1px solid #1c1c1c; padding-top: 18px;
      color: var(--muted); font-size: 12px;
    }
    .engineer summary {
      cursor: pointer; color: var(--fg); margin-bottom: 14px;
      list-style: none; font-size: 13px; letter-spacing: 0.02em;
    }
    .engineer summary::-webkit-details-marker { display: none; }
    .engineer code { color: #cfcfcf; }
    .engineer .bar {
      display: flex; align-items: center; justify-content: flex-start; gap: 12px;
      flex-wrap: wrap; margin: 14px 0 18px;
    }
    .switch {
      display: inline-flex; border: 1px solid #333; border-radius: 8px; overflow: hidden;
    }
    .switch button {
      background: transparent; color: var(--muted); border: 0;
      padding: 8px 16px; font: inherit; cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .switch button.on { background: #222; color: var(--fg); }
    .bar .action {
      background: transparent; color: var(--control); border: 1px solid var(--control);
      border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .bar .action:hover { background: var(--control); color: #fff; }
    .meta { display: grid; gap: 6px; }
  </style>
</head>
<body>
  <div class="charger">
    <div class="face">
      <div class="glass-wrap">
        <img id="glass" width="480" height="128" alt="Charger display" />
      </div>
      <div class="knob" id="knob" title="Encoder" aria-label="Encoder knob"></div>
    </div>

    <div class="rack" id="rack"></div>
    <div class="type-pop" id="typePop" role="dialog" aria-label="Cell type">
      <button type="button" data-type="KLVR-AA">AA</button>
      <button type="button" data-type="KLVR-AAA">AAA</button>
    </div>
    <div class="status" id="status"></div>

    <details class="engineer">
      <summary>Engineer</summary>
      <div class="bar">
        <div class="switch" role="group" aria-label="Cell type">
          <button type="button" id="typeAA" class="on">AA</button>
          <button type="button" id="typeAAA">AAA</button>
        </div>
        <button type="button" class="action" id="empty">Empty</button>
        <button type="button" class="action" id="fill">Fill</button>
        <button type="button" class="action" id="identify">Identify</button>
      </div>
      <div class="meta">
        <div>Firmware pin: <code id="pin">…</code></div>
        <div>Snapshot: <code id="snapPath">…</code></div>
        <div>Glass: <code id="glassPath">…</code></div>
        <div>Verdict: <code id="verdict">…</code></div>
      </div>
    </details>
  </div>

  <script>
    let cellType = "KLVR-AA";
    let knobAngle = 0;
    let lastDetent = 0;
    const rack = document.getElementById("rack");
    const statusEl = document.getElementById("status");
    const glass = document.getElementById("glass");
    const typePop = document.getElementById("typePop");
    let paint = null; /* { mode: 'fill'|'eject', bays: Set, moved: bool, x, y } */
    let suppressClick = false;
    let pendingFill = null; /* number[] */

    function setType(type) {
      cellType = type;
      document.getElementById("typeAA").classList.toggle("on", type === "KLVR-AA");
      document.getElementById("typeAAA").classList.toggle("on", type === "KLVR-AAA");
    }

    function clearPending() {
      document.querySelectorAll(".well.pending").forEach((w) => w.classList.remove("pending"));
    }

    function hideTypePop() {
      typePop.classList.remove("open");
      pendingFill = null;
      clearPending();
    }

    function showTypePop(clientX, clientY, bays) {
      pendingFill = bays;
      const pad = 12;
      typePop.classList.add("open");
      const w = typePop.offsetWidth || 120;
      const h = typePop.offsetHeight || 44;
      let left = clientX - w / 2;
      let top = clientY - h - 14;
      left = Math.max(pad, Math.min(window.innerWidth - w - pad, left));
      top = Math.max(pad, Math.min(window.innerHeight - h - pad, top));
      typePop.style.left = left + "px";
      typePop.style.top = top + "px";
    }

    function wellAt(clientX, clientY) {
      const el = document.elementFromPoint(clientX, clientY);
      return el && el.closest ? el.closest(".well") : null;
    }

    function addPaintBay(bay, occupied) {
      if (!paint) return;
      if (paint.mode === "fill" && occupied) return;
      if (paint.mode === "eject" && !occupied) return;
      paint.bays.add(bay);
      const well = rack.querySelector(`.well[data-bay="${bay}"]`);
      if (well) well.classList.add("pending");
    }

    function buildRack() {
      rack.innerHTML = "";
      for (const row of [0, 1]) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        for (const half of [0, 1]) {
          const halfEl = document.createElement("div");
          halfEl.className = "half";
          for (let i = 0; i < 12; i++) {
            const bay = row * 24 + half * 12 + i;
            const well = document.createElement("div");
            well.className = "well";
            well.dataset.bay = String(bay);
            well.innerHTML = '<div class="cell" hidden><div class="fill"></div></div><div class="light"></div>';
            well.addEventListener("click", (e) => {
              if (suppressClick) {
                e.preventDefault();
                e.stopPropagation();
                return;
              }
              onWell(bay);
            });
            halfEl.appendChild(well);
          }
          rowEl.appendChild(halfEl);
        }
        rack.appendChild(rowEl);
      }
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text() || r.statusText);
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("json")) return r.json();
      if (ct.includes("png") || ct.includes("octet")) return r.blob();
      return r.text();
    }

    function paintBay(well, bat, led) {
      const cell = well.querySelector(".cell");
      const fill = well.querySelector(".fill");
      const light = well.querySelector(".light");
      const occupied = bat && bat.slotState !== "empty";
      cell.hidden = !occupied;
      if (!occupied) {
        light.style.background = "transparent";
        return;
      }
      const aaa = (bat.batteryDetected || "").includes("AAA");
      cell.classList.toggle("aaa", aaa);
      const pct = Math.max(0, Math.min(100, Number(bat.stateOfChargePercent) || 0));
      fill.style.height = (bat.slotState === "done" ? 100 : pct) + "%";
      if (!led) {
        light.style.background = "transparent";
        return;
      }
      const a = Math.max(0, Math.min(1, (led.brightness || 0) / 255));
      light.style.background = `rgba(${led.r},${led.g},${led.b},${0.2 + 0.8 * a})`;
    }

    async function refreshGlass() {
      try {
        const blob = await api("/api/v2/twin/glass");
        const url = URL.createObjectURL(blob);
        const prev = glass.dataset.url;
        glass.src = url;
        glass.dataset.url = url;
        if (prev) URL.revokeObjectURL(prev);
      } catch (_) {
        /* renderer optional until built */
      }
    }

    async function refresh() {
      const s = await api("/api/v2/charger/status");
      const lights = (await api("/api/v2/twin/lights").catch(() => ({ lights: [] }))).lights || [];
      document.querySelectorAll(".well").forEach((well) => {
        const i = Number(well.dataset.bay);
        paintBay(well, s.batteries[i], lights[i] || null);
      });
      document.getElementById("verdict").textContent = JSON.stringify({
        totals: s.totals || {},
        eta: s.etaSeconds,
        overlay: s.displayOverlay || "none",
      });
      statusEl.textContent = "";
      return s;
    }

    async function onWell(bay) {
      try {
        const s = await api("/api/v2/charger/status");
        const b = s.batteries[bay];
        if (b.slotState === "empty") {
          showTypePop(
            window._lastPointerX || window.innerWidth / 2,
            window._lastPointerY || window.innerHeight / 2,
            [bay]
          );
          const well = rack.querySelector(`.well[data-bay="${bay}"]`);
          if (well) well.classList.add("pending");
          return;
        }
        await api(`/api/v2/charger/eject/${bay}`, { method: "POST" });
        await refresh();
        refreshGlass();
      } catch (e) {
        statusEl.textContent = String(e.message || e);
      }
    }

    async function fillBays(bays, type) {
      setType(type);
      hideTypePop();
      try {
        for (const bay of bays) {
          await api(`/api/v2/charger/insert/${bay}?type=${encodeURIComponent(type)}`, { method: "POST" });
        }
        await refresh();
        refreshGlass();
      } catch (e) {
        statusEl.textContent = String(e.message || e);
      }
    }

    async function ejectBays(bays) {
      clearPending();
      try {
        for (const bay of bays) {
          await api(`/api/v2/charger/eject/${bay}`, { method: "POST" });
        }
        await refresh();
        refreshGlass();
      } catch (e) {
        statusEl.textContent = String(e.message || e);
      }
    }

    rack.addEventListener("pointerdown", (e) => {
      const well = e.target.closest && e.target.closest(".well");
      if (!well || e.button !== 0) return;
      hideTypePop();
      window._lastPointerX = e.clientX;
      window._lastPointerY = e.clientY;
      const bay = Number(well.dataset.bay);
      const occupied = !well.querySelector(".cell").hidden;
      paint = {
        mode: occupied ? "eject" : "fill",
        bays: new Set(),
        moved: false,
        x: e.clientX,
        y: e.clientY,
        pointerId: e.pointerId,
      };
      addPaintBay(bay, occupied);
      rack.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    rack.addEventListener("pointermove", (e) => {
      if (!paint) return;
      window._lastPointerX = e.clientX;
      window._lastPointerY = e.clientY;
      if (Math.hypot(e.clientX - paint.x, e.clientY - paint.y) > 6) paint.moved = true;
      const well = wellAt(e.clientX, e.clientY);
      if (!well) return;
      const bay = Number(well.dataset.bay);
      const occupied = !well.querySelector(".cell").hidden;
      addPaintBay(bay, occupied);
    });
    async function endPaint(e) {
      if (!paint) return;
      const done = paint;
      paint = null;
      try { rack.releasePointerCapture(done.pointerId); } catch (_) {}
      const bays = [...done.bays].sort((a, b) => a - b);
      if (!bays.length) {
        clearPending();
        return;
      }
      if (done.mode === "eject") {
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 0);
        await ejectBays(bays);
        return;
      }
      /* fill: ask AA / AAA after paint (pointerdown preventDefault skips click) */
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 0);
      showTypePop(e.clientX || done.x, e.clientY || done.y, bays);
    }
    rack.addEventListener("pointerup", endPaint);
    rack.addEventListener("pointercancel", () => {
      paint = null;
      clearPending();
    });

    typePop.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-type]");
      if (!btn || !pendingFill) return;
      fillBays(pendingFill, btn.dataset.type);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideTypePop();
    });
    document.addEventListener("pointerdown", (e) => {
      if (typePop.classList.contains("open") && !typePop.contains(e.target) && !e.target.closest(".well")) {
        hideTypePop();
      }
    });

    document.getElementById("typeAA").onclick = () => setType("KLVR-AA");
    document.getElementById("typeAAA").onclick = () => setType("KLVR-AAA");
    document.getElementById("empty").onclick = async () => {
      try {
        await api("/api/v2/charger/bulk_clear", { method: "POST" });
        await refresh(); refreshGlass();
      } catch (e) { statusEl.textContent = String(e.message || e); }
    };
    document.getElementById("fill").onclick = async () => {
      try {
        const no_aaa = cellType === "KLVR-AA";
        const no_aa = cellType === "KLVR-AAA";
        await api(`/api/v2/charger/bulk_insert?no_aa=${no_aa}&no_aaa=${no_aaa}`, { method: "POST" });
        await refresh(); refreshGlass();
      } catch (e) { statusEl.textContent = String(e.message || e); }
    };
    document.getElementById("identify").onclick = async () => {
      try {
        await api("/api/v2/device/identify", { method: "POST" });
        await refresh(); refreshGlass();
      } catch (e) { statusEl.textContent = String(e.message || e); }
    };

    const knob = document.getElementById("knob");
    function reportEncoder(detents, pressed) {
      const body = {};
      if (detents) body.detents = detents;
      if (pressed !== undefined) body.pressed = pressed;
      api("/api/v2/twin/encoder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).catch(() => {});
    }
    function setKnob(deg) {
      const prev = knobAngle;
      knobAngle = deg;
      knob.style.transform = `rotate(${deg}deg)`;
      const detent = Math.round(deg / 15);
      if (detent !== lastDetent) {
        reportEncoder(detent - lastDetent);
        lastDetent = detent;
      }
      void prev;
    }
    let dragging = false, lastAng = 0;
    function angFromEvent(e) {
      const r = knob.getBoundingClientRect();
      const x = (e.clientX ?? e.touches?.[0]?.clientX) - (r.left + r.width / 2);
      const y = (e.clientY ?? e.touches?.[0]?.clientY) - (r.top + r.height / 2);
      return Math.atan2(y, x) * 180 / Math.PI;
    }
    knob.addEventListener("pointerdown", (e) => {
      dragging = true; knob.classList.add("turning");
      lastAng = angFromEvent(e); knob.setPointerCapture(e.pointerId);
      reportEncoder(0, true);
    });
    knob.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const a = angFromEvent(e);
      let d = a - lastAng;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      setKnob(knobAngle + d);
      lastAng = a;
    });
    knob.addEventListener("pointerup", () => {
      dragging = false; knob.classList.remove("turning");
      reportEncoder(0, false);
    });
    knob.addEventListener("wheel", (e) => {
      e.preventDefault();
      setKnob(knobAngle + (e.deltaY > 0 ? 15 : -15));
    }, { passive: false });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") setKnob(knobAngle - 15);
      if (e.key === "ArrowRight") setKnob(knobAngle + 15);
      if (e.key === " ") { e.preventDefault(); reportEncoder(0, true); setTimeout(() => reportEncoder(0, false), 120); }
    });

    buildRack();
    api("/api/v2/twin/meta").then((m) => {
      document.getElementById("pin").textContent = m.firmware_pin || "?";
      document.getElementById("snapPath").textContent = m.lib_path || "not loaded";
      document.getElementById("glassPath").textContent = m.glass_renderer || "build ui-simulator";
    }).catch(() => {});
    refresh().then(() => refreshGlass()).catch((e) => { statusEl.textContent = String(e.message || e); });
    setInterval(() => { refresh().catch(() => {}); }, 500);
    setInterval(() => { refreshGlass().catch(() => {}); }, 1000);
  </script>
</body>
</html>
