<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klvr Charger Pro</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #8a8a8a;
      --well: #1a1a1a;
      --well-border: #2e2e2e;
      --control: #3b82f6;
      --glass-w: 480px;
      --glass-h: 128px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px; min-height: 100vh;
    }
    .charger {
      display: flex; flex-direction: column; gap: 28px;
      width: min(920px, 100%);
    }
    .face {
      display: flex; align-items: center; gap: 20px;
      justify-content: center;
    }
    .glass-wrap {
      width: var(--glass-w); height: var(--glass-h);
      background: #111; border: 1px solid #333; border-radius: 4px;
      overflow: hidden; image-rendering: pixelated;
      position: relative;
    }
    .glass-wrap canvas {
      width: 100%; height: 100%; display: block;
    }
    .glass-label {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: var(--muted); font-size: 12px;
      letter-spacing: 0.04em; pointer-events: none;
    }
    .knob {
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a4a4a, #1c1c1c 70%);
      border: 2px solid #555; cursor: grab; position: relative;
      touch-action: none; flex-shrink: 0;
    }
    .knob::after {
      content: ""; position: absolute; left: 50%; top: 8px;
      width: 3px; height: 14px; margin-left: -1.5px;
      background: #ddd; border-radius: 1px;
      transform-origin: 50% 20px;
    }
    .knob.turning { cursor: grabbing; }
    .rack {
      display: flex; flex-direction: column; gap: 16px;
    }
    .row {
      display: flex; gap: 24px; justify-content: center;
    }
    .half {
      display: grid; grid-template-columns: repeat(12, 28px); gap: 6px;
    }
    .well {
      width: 28px; height: 44px; border-radius: 4px;
      background: var(--well); border: 1px solid var(--well-border);
      cursor: pointer; position: relative;
      transition: transform 160ms ease, border-color 160ms ease;
    }
    .well:hover { border-color: #666; }
    .well:active { transform: scale(0.96); }
    .well .cell {
      position: absolute; left: 4px; right: 4px; top: 6px; bottom: 6px;
      border-radius: 2px; background: #2a2a2a;
    }
    .well .light {
      position: absolute; left: 50%; bottom: 3px; width: 8px; height: 3px;
      margin-left: -4px; border-radius: 1px; background: transparent;
    }
    .bar {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      flex-wrap: wrap;
    }
    .switch {
      display: inline-flex; border: 1px solid #333; border-radius: 8px; overflow: hidden;
    }
    .switch button {
      background: transparent; color: var(--muted); border: 0;
      padding: 8px 16px; font: inherit; cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .switch button.on { background: #222; color: var(--fg); }
    .bar .action {
      background: transparent; color: var(--control); border: 1px solid var(--control);
      border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .bar .action:hover { background: var(--control); color: #fff; }
    .engineer {
      margin-top: 8px; border-top: 1px solid #222; padding-top: 16px;
      color: var(--muted); font-size: 12px;
    }
    .engineer summary { cursor: pointer; color: var(--fg); margin-bottom: 8px; }
    .engineer code { color: #ccc; }
    .status { text-align: center; color: var(--muted); font-size: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="charger">
    <div class="face">
      <div class="glass-wrap">
        <canvas id="glass" width="480" height="128"></canvas>
        <div class="glass-label" id="glassLabel">480×128</div>
      </div>
      <div class="knob" id="knob" title="Encoder" aria-label="Encoder knob"></div>
    </div>

    <div class="rack" id="rack"></div>

    <div class="bar">
      <div class="switch" role="group" aria-label="Cell type">
        <button type="button" id="typeAA" class="on">AA</button>
        <button type="button" id="typeAAA">AAA</button>
      </div>
      <button type="button" class="action" id="empty">Empty</button>
      <button type="button" class="action" id="fill">Fill</button>
    </div>
    <div class="status" id="status"></div>

    <details class="engineer">
      <summary>Engineer</summary>
      <div>Firmware pin: <code id="pin">…</code></div>
      <div>Snapshot: <code id="snapPath">…</code></div>
      <div>Verdict: <code id="verdict">…</code></div>
      <div>Clock: real time (breath from firmware)</div>
    </details>
  </div>

  <script>
    const N = 48;
    let cellType = "KLVR-AA";
    let knobAngle = 0;
    const rack = document.getElementById("rack");
    const statusEl = document.getElementById("status");
    const glass = document.getElementById("glass");
    const gctx = glass.getContext("2d");
    const glassLabel = document.getElementById("glassLabel");

    function buildRack() {
      rack.innerHTML = "";
      for (const row of [0, 1]) {
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        for (const half of [0, 1]) {
          const halfEl = document.createElement("div");
          halfEl.className = "half";
          for (let i = 0; i < 12; i++) {
            const bay = row * 24 + half * 12 + i;
            const well = document.createElement("div");
            well.className = "well";
            well.dataset.bay = String(bay);
            well.innerHTML = '<div class="cell" hidden></div><div class="light"></div>';
            well.addEventListener("click", () => onWell(bay));
            halfEl.appendChild(well);
          }
          rowEl.appendChild(halfEl);
        }
        rack.appendChild(rowEl);
      }
    }

    async function api(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text() || r.statusText);
      return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
    }

    function paintGlassPlaceholder() {
      gctx.fillStyle = "#111";
      gctx.fillRect(0, 0, 480, 128);
      gctx.fillStyle = "#3a3a3a";
      gctx.font = "14px ui-sans-serif, system-ui, sans-serif";
      gctx.textAlign = "center";
      gctx.fillText("Firmware glass", 240, 60);
      gctx.font = "11px ui-sans-serif, system-ui, sans-serif";
      gctx.fillText("frame from pinned tick when LVGL is linked", 240, 80);
    }

    function paintBay(well, bat, led) {
      const cell = well.querySelector(".cell");
      const light = well.querySelector(".light");
      const occupied = bat && bat.slotState !== "empty";
      cell.hidden = !occupied;
      if (!led || !occupied) {
        light.style.background = "transparent";
        return;
      }
      const a = Math.max(0, Math.min(1, (led.brightness || 0) / 255));
      light.style.background = `rgba(${led.r},${led.g},${led.b},${0.25 + 0.75 * a})`;
    }

    async function refresh() {
      const s = await api("/api/v2/charger/status");
      const lights = (await api("/api/v2/twin/lights").catch(() => ({ lights: [] }))).lights || [];
      document.querySelectorAll(".well").forEach((well) => {
        const i = Number(well.dataset.bay);
        paintBay(well, s.batteries[i], lights[i] || null);
      });
      const t = s.totals || {};
      document.getElementById("verdict").textContent = JSON.stringify({
        totals: t,
        eta: s.etaSeconds,
        overlay: s.displayOverlay || "none",
      });
      statusEl.textContent = "";
      return s;
    }

    async function onWell(bay) {
      try {
        const s = await api("/api/v2/charger/status");
        const b = s.batteries[bay];
        if (b.slotState === "empty") {
          await api(`/api/v2/charger/insert/${bay}?type=${encodeURIComponent(cellType)}`, { method: "POST" });
        } else {
          await api(`/api/v2/charger/eject/${bay}`, { method: "POST" });
        }
        await refresh();
      } catch (e) {
        statusEl.textContent = String(e.message || e);
      }
    }

    document.getElementById("typeAA").onclick = () => {
      cellType = "KLVR-AA";
      document.getElementById("typeAA").classList.add("on");
      document.getElementById("typeAAA").classList.remove("on");
    };
    document.getElementById("typeAAA").onclick = () => {
      cellType = "KLVR-AAA";
      document.getElementById("typeAAA").classList.add("on");
      document.getElementById("typeAA").classList.remove("on");
    };
    document.getElementById("empty").onclick = async () => {
      try {
        await api("/api/v2/charger/bulk_clear", { method: "POST" });
        await refresh();
      } catch (e) { statusEl.textContent = String(e.message || e); }
    };
    document.getElementById("fill").onclick = async () => {
      try {
        const no_aaa = cellType === "KLVR-AA";
        const no_aa = cellType === "KLVR-AAA";
        await api(`/api/v2/charger/bulk_insert?no_aa=${no_aa}&no_aaa=${no_aaa}`, { method: "POST" });
        await refresh();
      } catch (e) { statusEl.textContent = String(e.message || e); }
    };

    const knob = document.getElementById("knob");
    function setKnob(deg) {
      knobAngle = deg;
      knob.style.setProperty("--a", deg + "deg");
      knob.style.transform = `rotate(${deg}deg)`;
    }
    let dragging = false, lastAng = 0;
    function angFromEvent(e) {
      const r = knob.getBoundingClientRect();
      const x = (e.clientX ?? e.touches?.[0]?.clientX) - (r.left + r.width / 2);
      const y = (e.clientY ?? e.touches?.[0]?.clientY) - (r.top + r.height / 2);
      return Math.atan2(y, x) * 180 / Math.PI;
    }
    knob.addEventListener("pointerdown", (e) => {
      dragging = true; knob.classList.add("turning");
      lastAng = angFromEvent(e); knob.setPointerCapture(e.pointerId);
    });
    knob.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const a = angFromEvent(e);
      let d = a - lastAng;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      setKnob(knobAngle + d);
      lastAng = a;
    });
    knob.addEventListener("pointerup", () => { dragging = false; knob.classList.remove("turning"); });
    knob.addEventListener("wheel", (e) => {
      e.preventDefault();
      setKnob(knobAngle + (e.deltaY > 0 ? 15 : -15));
    }, { passive: false });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") setKnob(knobAngle - 15);
      if (e.key === "ArrowRight") setKnob(knobAngle + 15);
    });

    buildRack();
    paintGlassPlaceholder();
    api("/api/v2/twin/meta").then((m) => {
      document.getElementById("pin").textContent = m.firmware_pin || "?";
      document.getElementById("snapPath").textContent = m.lib_path || "not loaded";
      if (m.lib_path) glassLabel.hidden = true;
    }).catch(() => {});
    refresh().catch((e) => { statusEl.textContent = String(e.message || e); });
    setInterval(() => { refresh().catch(() => {}); }, 500);
  </script>
</body>
</html>
